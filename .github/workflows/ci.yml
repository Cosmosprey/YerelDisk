name: Windows build, tests and portable package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: Run native NTFS/ACL/link tests as well
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Publish self-contained Windows x64 ZIP
        shell: pwsh
        run: .\scripts\Publish.ps1
      - name: Test the published DLLs (All on explicit manual request)
        shell: pwsh
        run: |
          $package = Get-Content .\artifacts\package.json -Raw | ConvertFrom-Json
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.native }}' -eq 'true') {
            & .\Kaynak\Dogrula.ps1 -All -PublishedProductDirectory $package.Package
          } else {
            & .\Kaynak\Dogrula.ps1 -PublishedProductDirectory $package.Package
          }
      - name: Upload portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: YerelDisk-win-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-evidence
          path: |
            Dogrulama/Guncel/Kosular/**/summary.json
            Dogrulama/Guncel/Kosular/**/summary.csv
            Dogrulama/Guncel/Kosular/**/*SHA256SUMS.csv
            Dogrulama/Guncel/Kosular/**/build-*.txt
            Dogrulama/Guncel/Kosular/**/results/**/*.txt
            Dogrulama/Guncel/Kosular/**/results/**/*.png
          retention-days: 14
